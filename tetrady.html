<script>
const NP=12,CFG={wacc:.75,fp:.1,ev:.07,skG:1,skE:1,mfr:1,dk:6,pProt:.3,thrE:.8,norep:0,botsw:.3,barr:9,follow:.7,claim:.6,nok1:1,selfp:0,strict:0,bself:.3};
const R={mikami:'Миками Теру',kira:'Кира',misa:'Миса',l:'L',n:'N',wat:'Ватари',inv:'Следователь'};
const INFO={
mikami:'Тетрадь у тебя. Начиная со второй ночи (в первую тетрадь ещё спит) вписываешь имя, причину и детали смерти (каждая причина — один раз), а раз за игру (на всю вашу команду) можешь подставить игрока: слежка L назовёт его подозрительным. Когда за столом остаётся 6 игроков или меньше, можно вписать и второе имя. Пока ты на свободе, Кира бессилен. Если тебя арестуют или разоблачат голосованием, тетрадь перейдёт к Кире. Команда знает друг друга. Слежка L покажет тебя подозрительным в 3 случаях из 4. Миса передаёт тебе то, что узнаёт. У вашей команды есть тайный чат.',
kira:'Пока Миками Теру на свободе, тетрадь у него, а не у тебя, и ты не убиваешь. Пока тетради у тебя нет, слежка L назовёт тебя подозрительным лишь в 1 случае из 10, как и любого мирного. Когда Миками арестуют или разоблачат голосованием, тетрадь перейдёт к тебе, и слежка станет называть тебя подозрительным в 3 случаях из 4. Тогда каждую ночь ты вписываешь в тетрадь имя и причину смерти: выбери из списка или придумай свою и добавь детали — время, место, обстоятельства. Каждая причина годится один раз. Раз за игру (на всю вашу команду) можешь подставить игрока: слежка L назовёт его подозрительным. Когда за столом остаётся 6 игроков или меньше, можно вписать и второе имя. Победа: L и N мертвы, или твоя команда в большинстве. У вашей команды есть тайный чат.',
misa:'Ты знаешь Киру. Раз за игру можешь увидеть роль любого игрока, но глаза шинигами заберут твою жизнь в конце ближайшего дня. Кира узнает увиденное этой же ночью. У вашей команды есть тайный чат.',
l:'Каждую ночь делаешь одно из двух: защищаешь игрока (тетрадь по нему не сработает) или следишь за ним. Мирный игрок кажется подозрительным в 1 случае из 10. Миками, Миса и Кира с тетрадью кажутся подозрительными в 3 случаях из 4, а Кира без тетради, как и мирный, лишь в 1 из 10. Защита и слежка без лимита. Днём один раз за игру можешь арестовать (кнопка только у тебя): угадал Киру — победа; арестовал Мису или Миками — они выбывают, но арест тратится; выбрал мирного — выбываешь сам, и арест тоже тратится. Ватари знает тебя и один раз примет удар вместо тебя.',
n:'Ты преемник L. Раз за игру ночью можешь подменить Тетрадь смерти: тот, у кого она сейчас (Миками Теру, а если он выбыл, то Кира), этой ночью никого не убьёт. Кто именно держит тетрадь, ты не узнаешь. Если L погибнет, ты станешь им и получишь его навыки, в том числе арест, если он не был потрачен. Узнаешь об этом ночью.',
wat:'Ты знаешь, кто L. Если тетрадь нацелится на L, ты один раз умрёшь вместо него, и причина смерти будет та, что предназначалась ему. Если L защищён, тетрадь не сработает вовсе.',
inv:'Ты ничего не знаешь. Слушай, спорь, голосуй. Раз за игру твой голос считается за два.'};

const susP=j=>{if(S.fr===j)return 1;const r=S.roles[j];return r=='misa'||r=='mikami'||r=='kira'&&!S.alive[ix('mikami')]?CFG.wacc:CFG.fp};

reveal:i=>{const q=S.q[i];if(q.done)return waitCard();if(needsPass(i)&&!q.st)return pass(i,'Показать мою роль','Q().st=1;stt()');return roleCard(i,true)},
night:i=>{const q=S.q[i],r=eff(i),h=`<p class=sub>Ночь ${S.round}</p>`;
 if(q.done)return h+waitCard();
 if(needsPass(i)&&!q.st)return h+pass(i,'Я готов','Q().st=1;stt()');
 if(!ready(i))return h+`<div class=card><p class=sub>Ночь только началась…</p><div class=scn data-k=wait></div><div class=big>Подожди</div><p class=sub>Скоро всё решится.</p>${needsPass(i)?'<button onclick="back()">Назад</button>':''}</div>`;
 if(S.roles[i]=='n'&&S.nNew)return h+`<div class="card paper"><h2>L мёртв</h2><p>Теперь L — это ты. Защита и слежка без лимита. Арест тоже твой, если прежний L его не потратил.</p><button class=p onclick="S.nNew=0;draw()">Принять имя</button></div>`;
 const mm=S.mi&&S.mi[S.roles[i]];if(mm)return h+`<div class="card paper">${EYE}<h2>Весть от Мисы</h2><p>Глаза шинигами видят: <b>${N(mm[0])}</b> — <b>${R[mm[1]]}</b>.</p><button class=p onclick="S.mi[S.roles[CUR]]=0;draw()">Запомнить</button></div>`;
 if(q.swd)return h+swapDone;
 if(writerOf(i)&&CFG.nok1&&S.round==1)return h+`<div class="card paper"><h2>Тетрадь молчит</h2><p>В первую ночь тетрадь ещё не пробудилась. Имя вписывать рано.</p><button class=p onclick="fin()">Скрыть</button></div>`;
 if(writerOf(i)){const t=al().filter(j=>!evil(S.roles[j])),ok=q.t!=null&&q.c.trim()&&!usedC(q.c);
  return h+`<div class="card paper"><h2>Впиши имя</h2>${pick(t,q.t,'selT')}${al().length<=CFG.dk?`<h2>Второе имя</h2><p class=sub>Игроков осталось мало: тетрадь берёт и вторую жертву. По желанию.</p>${pick(t.filter(j=>j!=q.t),q.t2,'selT2')}`:''}<h2>Причина смерти</h2><div class=pl>${CAUSES.map(c=>{const u=S.used.includes(c);return `<button class="${q.c==c?'sel':''} ${u?'used':''}" ${u?'disabled':''} onclick="Q().c='${c}';draw()">${c}</button>`}).join('')}</div><input placeholder="…или напиши свою" value="${esc(q.c)}" maxlength=40><input placeholder="Детали: время, место, обстоятельства" value="${esc(q.d)}" maxlength=90>${S.fu||!(r=='kira'||CFG.mfr)?'':`<h2>Подставить игрока</h2><p class=sub>Один раз. Слежка L назовёт его подозрительным.</p>${pick(al().filter(j=>j!=i),q.f,'selF')}`}<button id=kb class=p ${ok?'':'disabled'} onclick="writeDone()">Записать</button></div>`}
 if(r=='misa'&&(!S.misaUsed||q.seen!=null)){if(q.seen!=null)return h+`<div class=card>${EYE}<p class=sub>Глаза шинигами видят:</p><div class=big>${N(q.seen)}</div><div class=role>${R[S.roles[q.seen]]}</div><button class=p onclick="fin()">Запомнил</button></div>`;
  return h+`<div class=card><h2>Глаза шинигами</h2><p>Узнать роль игрока? Ты умрёшь в конце ближайшего дня, а Кира узнает увиденное этой же ночью.</p>${pick(al().filter(j=>j!=i),null,'misaSee')}<button onclick="fin()">Не сейчас</button></div>`}
 if(r=='l'){if(q.lr)return h+`<div class=card><p class=sub>Слежка показала:</p><div class=big>${N(q.lr[0])}</div><div class=role>${q.lr[1]?'подозрителен':'выглядит чисто'}</div><button class=p onclick="fin()">Запомнил</button></div>`;
  if(q.lm==3)return h+swapCard('Q().lm=0;draw()');

function start(){if(!HOST)return;const loc=[...document.querySelectorAll('#app [data-ln]')].map(e=>e.value.trim());let k=0;while(SEATS.length<NP){if(BOTS)SEATS.push({n:botName(),p:null,on:true,bot:true});else SEATS.push({n:loc[k++]||'Игрок '+(SEATS.length+1),p:null,on:true})}
 const names=SEATS.map(s=>s.n);CHP=[];CHK=[];RIC={};
 S={ph:'',names,roles:shuffle(['kira','misa','mikami','l','n','wat',...Array(NP-6).fill('inv')]),alive:Array(NP).fill(true),round:0,used:[],misaUsed:0,arrest:0,dvu:{},lpt:null,sw:0,fu:0,fr:null,wu:0,nUp:0,nNew:0,dm:{},gid:Date.now(),q:{},lc:null,vt:{},vw:{},night:{},pt:null,mi:null,a:null};

const RULES=`<div class=card><h2>Правила</h2><details><summary>Роли и ход игры</summary><ul>
<li><b>Состав:</b> Кира, Миками Теру, Миса, L, N, Ватари и шестеро следователей. Команда Киры знает друг друга, Ватари знает L.</li>
<li><b>Роли:</b> раздаются одновременно, каждый видит только свою. Кнопка «Роль» внизу слева напомнит её.</li>
<li><b>Ночь:</b> все ходят одновременно, на ход 30 секунд (у пишущего тетрадь 45). В первую ночь тетрадь ещё спит: никто не умирает. Ночь кончается, когда походили все или вышло время. Тетрадь у Миками Теру: он вписывает имя, причину и детали. Кира без тетради бессилен, пока Миками не арестован или не выбыл, тогда тетрадь уходит к Кире. Каждая причина годится один раз, можно придумывать свои. Когда за столом остаётся 6 игроков или меньше, пишущий может вписать второе имя (одна причина на обоих). Раз за игру он может подставить игрока: слежка L назовёт его подозрительным.</li>
<li><b>N:</b> раз за игру ночью подменяет Тетрадь смерти: её владелец (Миками Теру, а если он выбыл, то Кира) не сможет никого убить этой ночью. Кто он, N не узнаёт. Умер L — N молча становится L и забирает его навыки. Кира выигрывает, только когда мертвы оба.</li>
<li><b>Ватари:</b> раз закрывает L собой. Причина смерти при этом достаётся ему.</li>
<li><b>L:</b> каждую ночь одно действие на выбор: защита или слежка, без лимита. Слежка называет подозрительным Миками, Мису и Киру с тетрадью в 75% случаев, а мирного и Киру без тетради в 10%. Днём один раз арестует, кнопка есть только у L. Арестовал Киру — победа. Арестовал Мису или Миками — они выбывают, но арест тратится. Выбрал мирного — L выбывает.</li>
<li><b>Миса:</b> раз ночью видит роль игрока. Кира и Миками узнают её в ту же ночь, а Миса умирает в конце ближайшего дня.</li>
<li><b>Чаты:</b> общий чат работает только днём, во время обсуждения и голосования. Тайный чат Киры, Миками и Мисы работает и днём, и ночью, остальные его не видят. Выбывшие только читают.</li>
<li><b>Голосование:</b> одновременное и тайное, 30 секунд, можно воздержаться. Больше всех голосов — выбывает, роль открывается. Следователь раз голосует за двоих.</li>
<li><b>Рюк:</b> очень редко (примерно раз в 14 дней) вмешивается: подсказка, туман (таймер вдвое короче), кровавая луна (при ничьей выбывает случайный лидер) или зевок (двойные голоса не считаются).</li>
<li><b>Победа Киры:</b> L и N мертвы или команда Киры сравнялась числом с остальными. <b>Победа мирных:</b> Кира арестован или выбыл.</li></ul></details></div>`;
